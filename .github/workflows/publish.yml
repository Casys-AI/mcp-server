            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build and publish @casys/mcp-bridge to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
