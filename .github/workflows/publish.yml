name: Publish

# Triggered on push to main. Publishes workspace packages to JSR and npm.
# Each npm job is idempotent: it checks `npm view <pkg>@<ver>`
# before publishing so already-published versions exit cleanly without
# masking auth/build/network failures.

on:
  push:
    branches: [main]

jobs:
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish all packages to JSR
        run: npx jsr publish
        # Publishes all workspace members whose version isn't already on JSR.
        # Already-published versions are skipped automatically.

  publish-npm-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm whoami --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::NPM_TOKEN is invalid or lacks publish rights."
            echo "npm returns 404 (not 401) on a scoped package with a bad token,"
            echo "so a later publish failure would look like a missing package."
            exit 1
          fi
          echo "npm authenticated as $(npm whoami --registry https://registry.npmjs.org)"
      - name: Build and publish @casys/mcp-server to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/server
          bash scripts/build-node.sh
          cd dist-node
          npm install
          npx tsx ../scripts/smoke-node.mjs
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            exit 0
          fi
          npm publish --access public

