name: Publish

# Triggered on push to main. Publishes workspace packages to JSR and npm.
# Each npm job is idempotent: it checks `npm view <pkg>@<ver>`
# before publishing so already-published versions exit cleanly without
# masking auth/build/network failures.

on:
  push:
    branches: [main]

jobs:
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish all packages to JSR
        run: npx jsr publish
        # Publishes all workspace members whose version isn't already on JSR.
        # Already-published versions are skipped automatically.

  publish-npm-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One call, reused. Note this proves the token authenticates, not that
          # it carries publish rights on this scope — npm has no cheap check for
          # that. It still separates "nothing to publish" from "cannot publish",
          # which the version check below cannot do.
          if ! WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: ${WHO}"
            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build and publish @casys/mcp-server to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/server
          deno task build:npm

          PACK_DIR=$(mktemp -d)
          TARBALL_NAME=$(npm pack ./dist-node --pack-destination "$PACK_DIR" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          TARBALL="$PACK_DIR/$TARBALL_NAME"
          tar -tzf "$TARBALL" | grep -Fx 'package/LICENSE' >/dev/null

          CONSUMER_DIR=$(mktemp -d)
          (
            cd "$CONSUMER_DIR"
            npm init --yes >/dev/null
            npm pkg set type=module
            npm install --ignore-scripts --no-audit --no-fund "$TARBALL" typescript@5.9.3 @types/node@22
          )

          npx --yes node@20 scripts/smoke-node.mjs "$CONSUMER_DIR/node_modules/@casys/mcp-server/esm/mod.js"
          node scripts/smoke-node.mjs "$CONSUMER_DIR/node_modules/@casys/mcp-server/esm/mod.js"
          cp scripts/smoke-node-consumer.ts "$CONSUMER_DIR/smoke-node-consumer.ts"
          (
            cd "$CONSUMER_DIR"
            node --input-type=module --eval 'const pkg = await import("@casys/mcp-server"); if (typeof pkg.McpApp !== "function") throw new Error("package export missing")'
            npx tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM,DOM.Iterable smoke-node-consumer.ts
          )

          npm publish ./dist-node --dry-run --access public
          PKG_NAME=$(node -p "require('./dist-node/package.json').name")
          PKG_VERSION=$(node -p "require('./dist-node/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            exit 0
          fi
          npm publish ./dist-node --access public

  publish-npm-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One call, reused. Note this proves the token authenticates, not that
          # it carries publish rights on this scope — npm has no cheap check for
          # that. It still separates "nothing to publish" from "cannot publish",
          # which the version check below cannot do.
          if ! WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: ${WHO}"
            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build and publish @casys/mcp-compose to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/compose
          deno run -A scripts/build-npm.ts

          PACK_DIR=$(mktemp -d)
          TARBALL_NAME=$(npm pack ./dist-node --pack-destination "$PACK_DIR" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          TARBALL="$PACK_DIR/$TARBALL_NAME"
          for REQUIRED in package/LICENSE package/README.md package/CHANGELOG.md; do
            tar -tzf "$TARBALL" | grep -Fx "$REQUIRED" >/dev/null
          done

          cd dist-node
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            exit 0
          fi
          npm publish --access public

